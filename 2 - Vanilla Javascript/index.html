<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Cards Game - BSIT Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Three Cards Game</h1>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-box">
                <h2>Player 1 Score</h2>
                <p id="p1-score">0</p>
            </div>
            <div class="score-box">
                <h2>Player 2 Score</h2>
                <p id="p2-score">0</p>
            </div>
        </div>

        <!-- Result Status -->
        <h3 id="result-message">Click "Draw Cards" to start!</h3>

        <!-- Card Play Area -->
        <div class="hands-container">
            <div class="player-hand">
                <h2>Player 1 Hand</h2>
                <div class="cards-row">
                    <div class="card p1-card"></div>
                    <div class="card p1-card"></div>
                    <div class="card p1-card"></div>
                </div>
            </div>

            <div class="player-hand">
                <h2>Player 2 Hand</h2>
                <div class="cards-row">
                    <div class="card p2-card"></div>
                    <div class="card p2-card"></div>
                    <div class="card p2-card"></div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <button id="draw-btn">Draw Cards</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
